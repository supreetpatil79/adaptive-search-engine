name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-ubuntu:
    name: Build + Test (Ubuntu x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake g++ build-essential curl tar

      - name: Download ONNX Runtime (Linux x64)
        run: |
          ORT_VER="1.18.0"
          mkdir -p third_party
          curl -sSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-x64-${ORT_VER}.tgz" -o /tmp/ort.tgz
          tar -xzf /tmp/ort.tgz -C third_party/
          rm -f /tmp/ort.tgz

      - name: Configure CMake
        run: |
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SANITIZERS=OFF

      - name: Build all targets
        run: |
          cmake --build build-ci --parallel 4

      - name: Run CTest test suite (all 11 unit tests)
        run: |
          ctest --test-dir build-ci --output-on-failure

      - name: Run pruning benchmark (smoke test)
        run: |
          build-ci/benchmark_pruning /nonexistent || true

  build-and-test-macos:
    name: Build + Test (macOS arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      - name: Download ONNX Runtime (macOS arm64)
        run: |
          ORT_VER="1.18.0"
          mkdir -p third_party
          curl -sSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-osx-arm64-${ORT_VER}.tgz" -o /tmp/ort.tgz
          tar -xzf /tmp/ort.tgz -C third_party/
          rm -f /tmp/ort.tgz

      - name: Configure CMake
        run: |
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets
        run: |
          cmake --build build-macos --parallel 4

      - name: Run CTest test suite (all 11 unit tests)
        run: |
          ctest --test-dir build-macos --output-on-failure






