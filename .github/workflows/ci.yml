name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build + Unit Tests (Ubuntu)
    runs-on: ubuntu-latest

    env:
      # ONNX Runtime not available on CI — disable ORT-dependent targets.
      # Core logic (BM25, WAND, RRF, stemmer, spell, concurrency) builds fine.
      BUILD_DIR: build-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake g++ build-essential

      # ── Stub out ORT so core targets build without the dylib ──────────
      - name: Create ORT stubs (CI-only)
        run: |
          ORT_DIR=third_party/onnxruntime-osx-arm64-1.28.0
          mkdir -p "${ORT_DIR}/include" "${ORT_DIR}/lib"
          # Minimal stub header so CMake finds the file
          cat > "${ORT_DIR}/include/onnxruntime_cxx_api.h" << 'EOF'
          // CI stub — real header ships with the ONNX Runtime SDK
          #pragma once
          EOF
          # Stub shared library (empty .so — core targets don't use ORT at link time)
          touch "${ORT_DIR}/lib/libonnxruntime.dylib"

      - name: Configure (no-ORT build for core tests)
        run: |
          cmake -S . -B $BUILD_DIR \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SANITIZERS=OFF

      - name: Build core targets
        run: |
          cmake --build $BUILD_DIR --target test_rrf test_concurrency benchmark_pruning --parallel 4

      - name: Run RRF unit tests (16 assertions)
        run: |
          $BUILD_DIR/test_rrf
          echo "test_rrf exit code: $?"

      - name: Run concurrency stress test
        run: |
          $BUILD_DIR/test_concurrency
          echo "test_concurrency exit code: $?"

      - name: Run pruning benchmark (smoke test)
        run: |
          # No corpus on CI — just verify the binary exits cleanly with missing file
          $BUILD_DIR/benchmark_pruning /nonexistent || true

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      - name: Create ORT stubs
        run: |
          ORT_DIR=third_party/onnxruntime-osx-arm64-1.28.0
          mkdir -p "${ORT_DIR}/include" "${ORT_DIR}/lib"
          echo '#pragma once' > "${ORT_DIR}/include/onnxruntime_cxx_api.h"
          touch "${ORT_DIR}/lib/libonnxruntime.dylib"

      - name: Configure + Build
        run: |
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos --target test_rrf test_concurrency --parallel 4

      - name: Run tests
        run: |
          ./build-macos/test_rrf
          ./build-macos/test_concurrency
